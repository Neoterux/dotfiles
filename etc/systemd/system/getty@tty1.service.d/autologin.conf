# Autologin en tty1 -> ~/.zprofile arranca Hyprland via uwsm -> la sesion se
# bloquea sola al arrancar (v3/hypr/scripts/session-unlock). La password se
# pide en hyprlock, no aca, y con esa misma se desbloquea el keyring.
#
# Solo tty1: las demas ttys siguen pidiendo login normal (sirven de salida
# de emergencia si la sesion grafica no levanta).
#
# `-o '-p -f -- \\u'`: login -f (sin password) preservando el entorno, igual
# que el ejemplo de la wiki de Arch. `- ${TERM}` y --noreset copian el
# ExecStart original de getty@.service de este systemd.
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty -o '-p -f -- \\u' --noreset --noclear --autologin neoterux - ${TERM}
