# hyprtoolkit — tema gruvbox glass
#
# Lo leen TODAS las apps hechas con hyprtoolkit, en particular
# hyprpolkitagent (>= 0.2.0 ya no es QML: el dialogo de "Authentication
# Required" que abren pkexec, systemctl, Bitwarden con desbloqueo del
# sistema, ...). Ruta fija: ~/.config/hypr/hyprtoolkit.conf.
#
# Colores en 0xAARRGGBB. Paleta = quickshell/theme/Colors.qml:
#   bg #161320  fg #ebdbb2  accent #fe8019  yellow #fabd2f  cream #fbf1c7
#
# `background` lleva alpha a proposito: la regla "polkit-modal" de
# hyprland-neo/workspaces le pone blur del compositor detras, igual que a
# la barra y a los drawers.

background = 0xE6161320
base = 0xFF1D2021
alternate_base = 0xFF282828
text = 0xFFEBDBB2
bright_text = 0xFFFBF1C7
link_text = 0xFF83A598

accent = 0xFFFE8019
accent_secondary = 0xFFFABD2F

font_family = Inter
font_family_monospace = JetBrainsMono Nerd Font
icon_theme = Adwaita

h1_size = 20
h2_size = 15
h3_size = 13
font_size = 11
small_font_size = 10

rounding_large = 16
rounding_small = 8
