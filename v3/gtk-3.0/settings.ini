# GTK3 no entiende `org.gnome.desktop.interface color-scheme`; el modo oscuro
# se pide con gtk-application-prefer-dark-theme. Antes esto no existia y ademas
# GTK_THEME='Nord' (tema inexistente) forzaba el Adwaita claro, asi que el
# dialogo de archivos de Firefox salia blanco. Ver hypr/hyprland-neo/env/init.lua.
# El tinte gruvbox va en gtk.css, al lado de este archivo.
[Settings]
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Bibata-Modern-Amber
gtk-cursor-theme-size=24
gtk-font-name=Adwaita Sans 11
gtk-enable-animations=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
