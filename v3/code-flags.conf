--gtk-version=4
--ignore-gpu-blocklist
--enable-features=TouchpadOverscrollHistoryNavigation,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL
--enable-wayland-ime
--password-store=gnome-libsecret
# /usr/bin/code (visual-studio-code-bin) le borra los comentarios con sed y
# pega todo en una sola linea de argumentos.
#
# --enable-features va UNA sola vez: Chromium solo respeta el ULTIMO
# --enable-features, una segunda linea descartaria en silencio a la primera.
# Los dos AcceleratedVideoDecode* son VA-API (auditoria de hwaccel del
# 2026-09-04, verificados compilados en el Electron de VS Code).
#
# Sin --ozone-platform-hint: Electron lo elimino en la 39 y desde Chromium
# 140 "auto" (Wayland si hay WAYLAND_DISPLAY) es el default. Este VS Code
# trae Chromium 150, asi que el flag ya no hacia nada.
